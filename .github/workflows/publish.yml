name: Publish to NPM and MCP Registry

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Required for GitHub release
      id-token: write # Required for npm provenance and OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.5.1+, which fixes the OIDC trusted-publishing
          # handshake bug present in Node 22's npm 10.x (npm/cli#8976).
          # Pinned exactly: the bundled npm decides whether OIDC works, and 24.19.0's npm 11.17.0
          # failed with E401 where 24.20.0's npm 11.19.0 published. A release can't be retried.
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: pnpm install

      - name: Run validation pipeline
        run: pnpm run ci

      - name: Verify package contents
        run: |
          echo "Files to be published:"
          npm pack --dry-run

      # Catches a file silently dropping out of package.json's "files" array,
      # which shipped a 2.3.0 without manifest.json.
      - name: Check nothing regressed against the published package
        run: node scripts/check-package-contents.mjs

      # server.json carries the version twice and manifest.json once; all three
      # must match package.json or the registry entry points at the wrong release.
      - name: Check version consistency
        run: pnpm check:versions

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      # Before npm publish, not after: publishing to npm cannot be undone, and a
      # malformed server.json would otherwise surface only once it already had.
      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The MCP registry checks that the version exists on npm, and npm can take minutes to serve a
      # new one (about four for 2.4.0), so registering straight after publish fails. Waiting for the
      # tarball as well also catches a publish that left the version staged without one.
      - name: Wait for npm to serve the new version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          meta="https://registry.npmjs.org/${name}/${version}"
          tarball="https://registry.npmjs.org/${name}/-/${name}-${version}.tgz"
          for attempt in $(seq 1 60); do
            meta_status=$(curl -s -o /dev/null -w "%{http_code}" "$meta")
            tarball_status=$(curl -s -o /dev/null -w "%{http_code}" -I "$tarball")
            if [ "$meta_status" = "200" ] && [ "$tarball_status" = "200" ]; then
              echo "npm serves ${name}@${version} (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}: metadata ${meta_status}, tarball ${tarball_status}; waiting 15s"
            sleep 15
          done
          echo "::error::npm did not serve ${name}@${version} within 15 minutes"
          exit 1

      # Authenticates with the same id-token permission npm provenance uses. After the wait, so the
      # registry's short-lived token is fresh when it publishes.
      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
