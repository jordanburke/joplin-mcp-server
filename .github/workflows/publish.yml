name: Publish to NPM and MCP Registry

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub release
      id-token: write # Required for npm provenance and OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.5.1+, which fixes the OIDC trusted-publishing
          # handshake bug present in Node 22's npm 10.x (npm/cli#8976).
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: pnpm install

      - name: Run validation pipeline
        run: pnpm run validate

      - name: Verify package contents
        run: |
          echo "Files to be published:"
          npm pack --dry-run

      # Catches a file silently dropping out of package.json's "files" array,
      # which shipped a 2.3.0 without manifest.json.
      - name: Check nothing regressed against the published package
        run: node scripts/check-package-contents.mjs

      # server.json carries the version twice and manifest.json once; all three
      # must match package.json or the registry entry points at the wrong release.
      - name: Check version consistency
        run: pnpm check:versions

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      # Before npm publish, not after: publishing to npm cannot be undone, and a
      # malformed server.json would otherwise surface only once it already had.
      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Authenticates with the same id-token permission npm provenance uses.
      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
