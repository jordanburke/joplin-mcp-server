name: Publish to NPM

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub release
      id-token: write # Required for npm provenance and OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.5.1+, which fixes the OIDC trusted-publishing
          # handshake bug present in Node 22's npm 10.x (npm/cli#8976).
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: pnpm install

      - name: Run validation pipeline
        run: pnpm run validate

      - name: Verify package contents
        run: |
          echo "Files to be published:"
          npm pack --dry-run

      # Catches a file silently dropping out of package.json's "files" array,
      # which shipped a 2.3.0 without manifest.json.
      - name: Check nothing regressed against the published package
        run: node scripts/check-package-contents.mjs

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
