# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# A newer push to a pull request cancels the build it supersedes. A push to main gets a group of its own,
# because GitHub cancels a waiting run when a newer one joins its group, even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        # 24.x matches the publish runtime; validates native addons (sqlite3, keytar) there.

    steps:
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: pnpm install

      - name: Run CI Pipeline
        run: pnpm run ci

      # One runtime is enough: the packaged file list does not vary by Node.
      - name: Check nothing regressed against the published package
        if: matrix.node-version == '24.x'
        run: node scripts/check-package-contents.mjs

      - name: Check version consistency
        if: matrix.node-version == '24.x'
        run: pnpm check:versions
